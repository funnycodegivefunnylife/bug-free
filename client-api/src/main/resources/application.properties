# Application configuration
spring.application.name=client-api
server.port=8080

# Logging configuration with MDC support
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [request_id=%X{request_id}] - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [request_id=%X{request_id}] - %msg%n
logging.file.name=logs/client-api.log
logging.level.bugfree.challenge=DEBUG
logging.level.org.springframework.web=INFO
